name: Evidence dashboard
on:
  push:
    branches: [main, arena/24aeb4a8-gold2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Preserved root and initial dashboards
        run: |
          python3 tools/qa.py
          python3 tools/build_site.py
          python3 scripts/build.py
          python3 scripts/audit.py
          node scripts/test.js
      - name: Evidence, unit, deterministic build, links, security, browser and axe
        run: npm run check
      - name: Generated evidence dashboard must be committed
        run: git diff --exit-code -- explore data/site-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-checks
          path: test-results/
          retention-days: 14
