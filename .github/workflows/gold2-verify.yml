name: GOLD2 verify

on:
  push:
    branches: [main, arena/6ca03571-gold2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Build the site from verified data
        run: python3 tools/build_site.py

      - name: Hallucination audit (evidence quotes, source domains, blanks, links)
        run: python3 tools/qa.py

      - name: Upload the audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa-report
          path: reports/qa-report.md
