name: GOLD2 verify

on:
  push:
    branches: [main, arena/ca4c9d8a-gold2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Build the root dashboard from source-backed data
        run: python3 tools/build_site.py

      - name: Field-level hallucination, integration, link, and security audit
        run: python3 tools/qa.py

      - name: Calculator unit tests
        run: node tools/test_calculator.js

      - name: Refresh the rendered QA summary after the audit
        run: python3 tools/build_site.py

      - name: Independent cross-schema negative review
        run: python3 reviews/independent_snapshot_audit.py .

      - name: Confirm generated files were committed and are reproducible
        run: git diff --exit-code -- . ':!reports/qa-report.md'

      - name: Upload the audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-report
          path: reports/qa-report.md
