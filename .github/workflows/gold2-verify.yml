name: GOLD2 verify

on:
  push:
    branches: [main, arena/ca4c9d8a-gold2, arena/8c810c15-gold2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"

      - name: Build the root dashboard from source-backed data
        run: python3 tools/build_site.py

      - name: Field-level hallucination, integration, link, and security audit
        run: python3 tools/qa.py

      - name: Calculator unit tests
        run: node tools/test_calculator.js

      - name: Refresh the rendered QA summary after the audit
        run: python3 tools/build_site.py

      - name: Independent cross-schema negative review
        run: python3 reviews/independent_snapshot_audit.py .

      - name: Security, WCAG contrast, and verbatim-provenance hallucination scan
        run: python3 audit/8c810c15/security_and_hallucination_scanner.py .

      - name: NIST conversion and scanner regression tests
        run: python3 audit/8c810c15/test_calculator_and_scanner.py

      - name: S-B200A880 independent field & row scanner + regression tests
        run: python3 audit/b200a880/hallucination_security_scanner.py . && python3 audit/b200a880/test_scanner.py

      - name: S-88AA65FD independent hallucination and rendering scanner
        run: python3 audit/88aa65fd/hallucination_scan.py .

      - name: Build and audit companion dashboard (P1-P8 + NIST gemstone calculator)
        run: python3 dashboard/scripts/build.py && python3 dashboard/scripts/verify.py --check-build && node dashboard/scripts/calc-test.js

      - name: Cross-repository S-9B875C81 hallucination, security, WCAG & provenance pass
        run: python3 audit/9b875c81/hallucination_security_pass.py . && python3 audit/9b875c81/test_pass.py

      - name: Confirm generated files were committed and are reproducible
        run: git diff --exit-code -- . ':!reports/qa-report.md'

      - name: Upload the audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa-report
          path: reports/qa-report.md
